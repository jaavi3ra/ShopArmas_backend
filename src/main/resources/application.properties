spring.application.name=gta
server.port=${PORT:8080}

# Datasource principal con pooling (Neon pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP ajustado para Neon serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000

# Flyway (usa conexion directa a Neon sin pooler para migraciones seguras)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_DIRECT_URL:${DB_URL}}
spring.flyway.user=${DB_DIRECT_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_DIRECT_PASSWORD:${DB_PASSWORD}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
