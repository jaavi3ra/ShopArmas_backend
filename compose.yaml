services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoparmas-app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: ${DB_URL}
      DB_DIRECT_URL: ${DB_DIRECT_URL:-${DB_URL}}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Servicio MySQL legado conservado hasta validar la transicion a Neon.
  # Para levantarlo manualmente: docker compose --profile legacy-mysql up -d mysql
  mysql:
    profiles: ["legacy-mysql"]
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tienda_armas_gta
      MYSQL_USER: gta_app
      MYSQL_PASSWORD: gta_local_dev
      MYSQL_ROOT_PASSWORD: gta_root_local_dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/TiendaArmasGTA.sql:/docker-entrypoint-initdb.d/01-tienda-gta.sql:ro

volumes:
  mysql_data:
