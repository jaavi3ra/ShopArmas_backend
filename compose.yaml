services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tienda_armas_gta
      MYSQL_USER: gta_app
      MYSQL_PASSWORD: gta_local_dev
      MYSQL_ROOT_PASSWORD: gta_root_local_dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/TiendaArmasGTA.sql:/docker-entrypoint-initdb.d/01-tienda-gta.sql:ro
volumes:
  mysql_data: